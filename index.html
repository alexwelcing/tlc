<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Legal Chronicle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap');
      
      body {
        font-family: 'Merriweather', serif;
        background-color: #f4f1ea;
        color: #1c1917;
        overflow-x: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #e6e2d3;
      }
      ::-webkit-scrollbar-thumb {
        background: #a8a29e;
        border: 1px solid #f4f1ea;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #78716c;
      }

      /* Animations */
      @keyframes press-rotate-in {
        0% { opacity: 0; transform: perspective(1000px) rotateX(-90deg) translateY(-20px) scale(0.9); filter: blur(4px) grayscale(100%); }
        40% { opacity: 1; transform: perspective(1000px) rotateX(10deg) translateY(0) scale(1.02); filter: blur(0px) grayscale(0%); }
        70% { transform: perspective(1000px) rotateX(-5deg) scale(0.99); }
        100% { opacity: 1; transform: perspective(1000px) rotateX(0deg) scale(1); filter: none; }
      }
      .animate-press-rotate { animation: press-rotate-in 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; transform-origin: center bottom; display: inline-block; backface-visibility: hidden; }

      /* Filters */
      .paper-distortion { filter: url(#wavy-paper) contrast(1.05); }
      .img-style-modern { filter: contrast(105%) brightness(105%); }
      .img-style-retro { filter: contrast(110%) saturate(140%) hue-rotate(-5deg); }

      /* 
         ENHANCED REALISTIC PAGE TURN 
         Simulates a page peeling from right to left (Next) or left to right (Prev)
      */
      
      .perspective-container {
        perspective: 2500px;
        perspective-origin: 50% 50%;
      }

      /* Exit: The current page lifts up and rotates away to the left */
      @keyframes book-flip-exit {
        0% { 
            transform: rotateY(0deg) translateZ(0);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            filter: brightness(100%);
        }
        40% {
            filter: brightness(95%); /* Slight shadow as it turns */
        }
        100% { 
            transform: rotateY(-110deg) translateZ(100px) translateX(-50px);
            opacity: 0;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.5);
            filter: brightness(80%);
        }
      }
      
      /* Enter: The new page lands from the right */
      @keyframes book-flip-enter {
        0% { 
            transform: rotateY(90deg) translateZ(100px) translateX(50px);
            opacity: 0;
            filter: brightness(110%); /* Bright as it catches light */
        }
        100% { 
            transform: rotateY(0deg) translateZ(0);
            opacity: 1;
            filter: brightness(100%);
        }
      }

      .turn-page-exit {
        transform-origin: center left;
        animation: book-flip-exit 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        z-index: 50;
      }

      .turn-page-enter {
        transform-origin: center left;
        animation: book-flip-enter 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000) forwards;
        z-index: 40;
      }

    </style>
    <!-- Polyfill for process.env -->
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'development';
    </script>

}
</script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'serif'],
            display: ['Playfair Display', 'serif'],
            branding: ['Cinzel', 'serif'],
          },
          colors: {
            paper: '#f4f1ea',
            ink: '#1c1917',
            accent: '#8b0000', 
            'accent-hover': '#660000',

</script>
</head>
  <body class="bg-paper text-ink selection:bg-stone-300 selection:text-black">
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
      <defs>
        <filter id="wavy-paper">
           <feTurbulence type="fractalNoise" baseFrequency="0.002" numOctaves="3" result="noise" />
           <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
